<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="presentation">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93a1a6"/><stop offset="1" stop-color="#8a999e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2f6165"/><stop offset="1" stop-color="#3f7276"/>
    </linearGradient>
    <linearGradient id="sand" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a98d6b"/><stop offset="0.45" stop-color="#c2a37b"/>
      <stop offset="1" stop-color="#b08f66"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a468"/><stop offset="1" stop-color="#8a6b42"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <path d="M0 150 H1600 V900 H0 Z" fill="url(#sea)"/>
  <!-- shoreline running diagonally from lower-left to the headland on the right -->
  <path d="M0 480 C 420 400 760 330 1010 262 L1600 250 V900 H0 Z" fill="url(#sand)"/>
  <path d="M0 470 C 420 392 760 322 1010 256 L1010 276 C 760 348 420 420 0 500 Z" fill="#8f7a5e" opacity=".55"/>
  <!-- headland -->
  <path d="M990 265 C 1120 170 1260 120 1420 62 L1600 40 V300 L990 300 Z" fill="url(#cliff)"/>
  <path d="M1180 120 C 1300 78 1440 52 1600 34 L1600 0 L1150 0 Z" fill="#5c6146" opacity=".85"/>
  <!-- vehicle: the one dark accent in the frame -->
  <rect x="735" y="520" width="118" height="40" rx="7" fill="#0d0d0f"/>
  <rect x="762" y="500" width="56" height="26" rx="6" fill="#14161a"/>

  <rect width="1600" height="900" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>
