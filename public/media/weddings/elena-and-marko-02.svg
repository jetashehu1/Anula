<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="presentation">
  <defs>
    <linearGradient id="ground" x1="0.708" y1="0.954" x2="0.292" y2="0.046">
      <stop offset="0" stop-color="#0f0e0c"/>
      <stop offset="1" stop-color="#050504"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c2a883" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c2a883" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".78">
      <stop offset=".45" stop-color="#050505" stop-opacity="0"/>
      <stop offset="1" stop-color="#050505" stop-opacity=".85"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#ground)"/>
  <ellipse cx="366" cy="455" rx="880" ry="600" fill="url(#glow)" opacity=".7"/>
  <rect x="291" y="460" width="448" height="480" fill="url(#glow)" opacity=".5"/>
  <rect width="1600" height="1200" fill="url(#vignette)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity=".055" style="mix-blend-mode:overlay"/>
</svg>
